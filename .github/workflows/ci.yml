name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the latest run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract-runner:
    name: Test candidate contract runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test pins, failure receipts and environment boundaries
        run: python -B -m unittest discover -s plugins/skillmeter/integration -p 'test_*.py' -v

  validate:
    name: Validate manifests & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check plugin version is clean SemVer
        run: node .github/scripts/check-version.mjs
      - name: Validate marketplace & plugin manifests
        run: node .github/scripts/validate-manifests.mjs

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # Released-state tests extract pinned historical commits without network.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run unit tests
        run: node --test
