name: Cross-repository compatibility

# Private dependency code never runs in a pull_request or pull_request_target job.
# The fixed environment must have independent review and contain the read token.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      verified_sha:
        description: Exact producer commit accepted in this invocation
        value: ${{ jobs.compatibility.outputs.verified_sha }}
      verified_at:
        description: UTC time of successful candidate acceptance
        value: ${{ jobs.compatibility.outputs.verified_at }}

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate shipping context and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/shipping-policy.cjs prepare
          gh api "repos/$GITHUB_REPOSITORY/environments/compatibility-reviewed" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/compatibility-reviewed/deployment-branch-policies?per_page=100" > "$RUNNER_TEMP/environment-branches.json"
          node .github/scripts/shipping-policy.cjs environment "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/environment-branches.json"
  compatibility:
    name: Pinned producer / collector / reader
    needs: preflight
    environment: compatibility-reviewed
    outputs:
      verified_sha: ${{ steps.accept.outputs.verified_sha }}
      verified_at: ${{ steps.accept.outputs.verified_at }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: producer
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Bind checked-out candidate and dependency pins
        id: pins
        working-directory: producer
        env:
          READ_TOKEN: ${{ secrets.COMPATIBILITY_READ_TOKEN }}
        run: |
          node .github/scripts/shipping-policy.cjs prepare
          node <<'JS'
          const fs = require('node:fs');
          const {dependencies} = require('./.github/scripts/shipping-policy.cjs');
          const pins = dependencies(JSON.parse(fs.readFileSync('compatibility/dependencies.json')));
          if (!process.env.READ_TOKEN) throw Error('protected-environment-read-token-required');
          for (const name of ['claude','collector','pipeline']) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${pins[name]}\n`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/expected-candidate.json`,JSON.stringify({version:1,startedAt:new Date().toISOString(),revisions:{producer:process.env.GITHUB_SHA,claude:pins.claude,collector:pins.collector,pipeline:pins.pipeline}}));
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SkillBench-AI/skillmeter-claude-code-collector
          ref: ${{ steps.pins.outputs.collector }}
          path: collector
          token: ${{ secrets.COMPATIBILITY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SkillBench-AI/skillbench-pipelines
          ref: ${{ steps.pins.outputs.pipeline }}
          path: pipeline
          token: ${{ secrets.COMPATIBILITY_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SkillBench-AI/skillmeter-claude-code-marketplace
          ref: ${{ steps.pins.outputs.claude }}
          path: claude
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: collector/go.sum
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.26'
          enable-cache: false
      - name: Install locked Python dependencies
        working-directory: pipeline
        run: uv sync --frozen --all-packages --all-groups
      - name: Prepare Go dependencies
        working-directory: collector
        run: go mod download
      - name: Run released-state and authorization tests
        working-directory: producer
        run: npm run check
      - name: Check mixed-client authorization
        id: mixed
        continue-on-error: true
        working-directory: producer
        run: node plugins/skillmeter/integration/check_mixed_auth.cjs ../claude > "$RUNNER_TEMP/mixed-auth.json"
      - name: Pin and run the cross-repository contract
        id: contract
        continue-on-error: true
        working-directory: producer
        run: |
          python -B plugins/skillmeter/integration/candidate_contract.py pin --collector ../collector --pipeline ../pipeline --manifest "$RUNNER_TEMP/candidate.json"
          python -B plugins/skillmeter/integration/candidate_contract.py run --collector ../collector --pipeline ../pipeline --manifest "$RUNNER_TEMP/candidate.json" --out "$RUNNER_TEMP/candidate-result.json" --python "$GITHUB_WORKSPACE/pipeline/.venv/bin/python" --go "$(command -v go)"
      - name: Require runtime faults to be detected
        id: faults
        continue-on-error: true
        working-directory: producer
        run: python -B plugins/skillmeter/integration/runtime_faults.py --pipeline ../pipeline --python "$GITHUB_WORKSPACE/pipeline/.venv/bin/python" --out "$RUNNER_TEMP/runtime-faults.json"
      - name: Require fresh matching contract evidence
        id: accept
        if: always()
        working-directory: producer
        env:
          FAULTS_OUTCOME: ${{ steps.faults.outcome }}
          MIXED_OUTCOME: ${{ steps.mixed.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          if [ "$FAULTS_OUTCOME" != success ] || [ "$MIXED_OUTCOME" != success ] || [ "$CONTRACT_OUTCOME" != success ]; then exit 1; fi
          node .github/scripts/compatibility-gate.cjs "$RUNNER_TEMP/expected-candidate.json" "$RUNNER_TEMP/mixed-auth.json" "$RUNNER_TEMP/candidate-result.json" "$RUNNER_TEMP/runtime-faults.json" "$RUNNER_TEMP/compatibility-acceptance.json"
          echo "verified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Retain content-free evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ github.sha }}
          path: |
            ${{ runner.temp }}/expected-candidate.json
            ${{ runner.temp }}/mixed-auth.json
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/candidate-result.json
            ${{ runner.temp }}/runtime-faults.json
            ${{ runner.temp }}/compatibility-acceptance.json
          if-no-files-found: warn
          retention-days: 14
