name: Release

# Tag strategy: releases are cut by pushing an annotated tag "vMAJOR.MINOR.PATCH"
# that matches the plugin version in plugins/skillmeter/.codex-plugin/plugin.json.
# Pushing such a tag runs the full gate (version match + manifests + tests) and,
# only if everything passes, publishes a GitHub Release with generated notes.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Releasing requires writing the GitHub Release + uploading the source archive.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches plugin version (clean SemVer)
        run: node .github/scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"

      - name: Validate marketplace & plugin manifests
        run: node .github/scripts/validate-manifests.mjs

      - name: Run unit tests
        run: node --test

      - name: Package plugin archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="skillmeter-codex-marketplace-${GITHUB_REF_NAME}/" \
            -o "dist/skillmeter-codex-marketplace-${GITHUB_REF_NAME}.tar.gz" \
            "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            "dist/skillmeter-codex-marketplace-${GITHUB_REF_NAME}.tar.gz"
